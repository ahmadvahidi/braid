<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="620" fill="#0b1220"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="36" y="44" fill="#e8f1f8" font-size="25" font-weight="bold">Braid — distributed entry · multipath session · no idle signature</text>

  <!-- rendezvous -->
  <rect x="36" y="70" width="320" height="112" rx="12" fill="#0e1c2e" stroke="#1e3a56"/>
  <text x="54" y="96" fill="#7dd3fc" font-size="14" font-weight="bold">SIGNED RENDEZVOUS RECORD</text>
  <text x="54" y="120" fill="#94a3b8" font-size="12.5">channel 1 · DNS record</text>
  <text x="54" y="141" fill="#94a3b8" font-size="12.5">channel 2 · repository / feed</text>
  <text x="54" y="162" fill="#94a3b8" font-size="12.5">channel 3 · update endpoint</text>
  <line x1="362" y1="126" x2="424" y2="126" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr3)"/>
  <text x="393" y="116" fill="#64748b" font-size="10.5" text-anchor="middle">any one</text>

  <!-- client -->
  <rect x="432" y="76" width="236" height="118" rx="12" fill="#0e1c2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="550" y="106" fill="#e8f1f8" font-size="17" text-anchor="middle" font-weight="bold">Client</text>
  <text x="550" y="130" fill="#94a3b8" font-size="12.5" text-anchor="middle">probes · prunes · pins</text>
  <text x="550" y="152" fill="#7dd3fc" font-size="12.5" text-anchor="middle">erasure encoder  k / n</text>
  <text x="550" y="174" fill="#64748b" font-size="11" text-anchor="middle">silent while the user is silent</text>

  <!-- three paths -->
  <rect x="716" y="60" width="230" height="48" rx="9" fill="#0e1c2e" stroke="#1e3a56"/>
  <text x="731" y="90" fill="#cbd5e1" font-size="13">path A · datacenter</text>
  <rect x="716" y="122" width="230" height="48" rx="9" fill="#0e1c2e" stroke="#1e3a56"/>
  <text x="731" y="152" fill="#cbd5e1" font-size="13">path B · home line</text>
  <rect x="716" y="184" width="230" height="48" rx="9" fill="#0e1c2e" stroke="#1e3a56"/>
  <text x="731" y="214" fill="#cbd5e1" font-size="13">path C · relay</text>

  <line x1="672" y1="120" x2="711" y2="86" stroke="#38bdf8" stroke-width="2.4" marker-end="url(#arr)"/>
  <line x1="672" y1="135" x2="711" y2="146" stroke="#38bdf8" stroke-width="2.4" marker-end="url(#arr)"/>
  <line x1="672" y1="150" x2="711" y2="206" stroke="#38bdf8" stroke-width="2.4" marker-end="url(#arr)"/>

  <!-- destination -->
  <rect x="990" y="104" width="176" height="84" rx="12" fill="#0b2233" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="1078" y="136" fill="#e8f1f8" font-size="14" text-anchor="middle" font-weight="bold">Destination</text>
  <text x="1078" y="158" fill="#94a3b8" font-size="11.5" text-anchor="middle">re-assembled session</text>
  <text x="1078" y="176" fill="#64748b" font-size="10.5" text-anchor="middle">no path sees it whole</text>

  <line x1="950" y1="84" x2="986" y2="120" stroke="#38bdf8" stroke-width="2.4" marker-end="url(#arr)"/>
  <line x1="950" y1="146" x2="986" y2="146" stroke="#38bdf8" stroke-width="2.4" marker-end="url(#arr)"/>
  <line x1="950" y1="208" x2="986" y2="172" stroke="#38bdf8" stroke-width="2.4" marker-end="url(#arr)"/>

  <text x="604" y="222" fill="#38bdf8" font-size="10.5" text-anchor="middle">n independent paths</text>

  <!-- pillars -->
  <rect x="36" y="270" width="352" height="122" rx="12" fill="#0e1c2e" stroke="#1e3a56"/>
  <text x="54" y="297" fill="#7dd3fc" font-size="14" font-weight="bold">THREE PILLARS</text>
  <text x="54" y="320" fill="#94a3b8" font-size="12.5">1 · discover entry, never assume it</text>
  <text x="54" y="342" fill="#94a3b8" font-size="12.5">2 · carry one session over n paths</text>
  <text x="54" y="364" fill="#94a3b8" font-size="12.5">3 · shape to a cover class, then stop</text>

  <!-- failure model -->
  <rect x="412" y="270" width="754" height="122" rx="12" fill="#0f1a10" stroke="#1f3a22"/>
  <text x="432" y="297" fill="#86efac" font-size="14" font-weight="bold">FAILURE MODEL</text>
  <text x="432" y="322" fill="#94a3b8" font-size="12.5">losing any n−k paths is a capacity event, not an outage</text>
  <text x="432" y="345" fill="#94a3b8" font-size="12.5">no single path carries the session; no single address decides reachability</text>
  <text x="432" y="368" fill="#64748b" font-size="11.5">the decisive identifier is removed, not hidden</text>

  <!-- notes -->
  <text x="36" y="430" fill="#64748b" font-size="11.5">Solid: data paths. Dashed: rendezvous. This is a concept diagram, not a deployed topology.</text>

  <g font-size="11.5" fill="#64748b">
    <text x="36" y="470">In scope: flow classification · address blocking · path loss · replayed records</text>
    <text x="36" y="492">Out of scope: global adversary · endpoint seizure · anonymity</text>
  </g>

  <text x="36" y="580" fill="#334155" font-size="11.5">Braid · concept · MIT / CC BY 4.0</text>
</svg>
